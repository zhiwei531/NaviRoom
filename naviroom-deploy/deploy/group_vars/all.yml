---
# ============================================================
# 应用部署路径（不需要修改）
# ============================================================
naviroom_app_dir: /opt/naviroom
naviroom_venv: /opt/naviroom/.venv

# ============================================================
# MySQL 配置
# 说明：Ansible 使用 root + 密码管理数据库，避免 auth_socket 插件差异
# 你需要修改两个密码：mysql_root_password / naviroom_db_password
# ============================================================
naviroom_db_name: navi_room_db
naviroom_db_user: navi_user
naviroom_db_password: "endjb&14h678"
mysql_root_password: "45#3280ghwy!13497"

# ============================================================
# FastAPI 服务（现阶段保持 false，等 API 写好再改为 true）
# ============================================================
naviroom_enable_api_service: true
naviroom_api_workdir: /opt/naviroom
naviroom_api_module: recommendation.server:app
naviroom_api_host: 0.0.0.0
naviroom_api_port: 8000
# JWT auth removed - public access only

# ============================================================
# Recommendation 配置
# ============================================================
# lexical | llm
naviroom_reco_semantic_mode: lexical
# manual | llm
naviroom_reco_requirements_mode: manual
# 若使用 LLM 模式，填入真实 API key；不使用可留空
naviroom_llm_api_key: ""

# ============================================================
# Frontend / Nginx（生产建议开启）
# ============================================================
naviroom_enable_frontend_deploy: true
naviroom_enable_nginx: true
# 前端源码目录名（相对仓库根，与 naviroom-deploy 同级；含登录/注册页）
naviroom_frontend_bundle_name: "Naviroom Homepage Upload Interface Version2"
naviroom_frontend_dir: /opt/naviroom/frontend
naviroom_frontend_web_root: /var/www/naviroom

# 域名与证书路径（开启 nginx 时必填）
naviroom_domain: naviroom.cn
naviroom_domain_www: www.naviroom.cn
naviroom_tls_cert_path: /etc/nginx/ssl/naviroom.cn/fullchain.crt
naviroom_tls_key_path: /etc/nginx/ssl/naviroom.cn/privkey.key