---
- name: Run data pipelines and save datasets to MySQL
  hosts: naviroom
  become: true
  gather_facts: false

  vars:
    naviroom_data_processing_dir: "{{ naviroom_app_dir }}/Data_processing"

  tasks:
    - name: Ensure data processing directory exists
      ansible.builtin.stat:
        path: "{{ naviroom_data_processing_dir }}/scripts/pipeline.py"
      register: pipeline_script

    - name: Stop if pipeline script is missing
      ansible.builtin.fail:
        msg: "pipeline.py not found under {{ naviroom_data_processing_dir }}/scripts. Run playbook.yml first."
      when: not pipeline_script.stat.exists

    - name: Run DKU dataset pipeline (rooms only)
      ansible.builtin.command:
        cmd: >
          {{ naviroom_venv }}/bin/python scripts/pipeline.py
          --rooms data/dku_room_data/rooms.csv
          --dataset-name dku
          --output-dir output
          --save-to-db
          --db-user {{ naviroom_db_user }}
          --db-password {{ naviroom_db_password }}
      args:
        chdir: "{{ naviroom_data_processing_dir }}"
      register: dku_pipeline
      changed_when: true

    - name: Run Kaggle dataset pipeline (rooms + reservations)
      ansible.builtin.command:
        cmd: >
          {{ naviroom_venv }}/bin/python scripts/pipeline.py
          --rooms data/kaggle_university_room_dataset/rooms_clean.csv
          --reservations data/kaggle_university_room_dataset/reservations.csv
          --dataset-name kaggle
          --output-dir output
          --save-to-db
          --db-user {{ naviroom_db_user }}
          --db-password {{ naviroom_db_password }}
      args:
        chdir: "{{ naviroom_data_processing_dir }}"
      register: kaggle_pipeline
      changed_when: true

    - name: Print pipeline output summary
      ansible.builtin.debug:
        msg:
          - "DKU pipeline rc={{ dku_pipeline.rc }}"
          - "Kaggle pipeline rc={{ kaggle_pipeline.rc }}"

