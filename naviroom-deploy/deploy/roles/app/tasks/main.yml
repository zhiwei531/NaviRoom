---
- name: Ensure app directory exists
  ansible.builtin.file:
    path: "{{ naviroom_app_dir }}"
    state: directory
    mode: '0755'

- name: Deploy Data_processing directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../Data_processing/"
    dest: "{{ naviroom_app_dir }}/Data_processing/"
    mode: preserve

- name: Deploy recommendation directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../recommendation/"
    dest: "{{ naviroom_app_dir }}/recommendation/"
    mode: preserve

- name: Create Python virtual environment
  ansible.builtin.command: "python3 -m venv {{ naviroom_venv }}"
  args:
    creates: "{{ naviroom_venv }}/bin/activate"

- name: Install app Python dependencies
  ansible.builtin.pip:
    requirements: "{{ naviroom_app_dir }}/Data_processing/requirements.txt"
    virtualenv: "{{ naviroom_venv }}"

- name: Install API dependencies
  ansible.builtin.pip:
    name:
      - python-multipart
    virtualenv: "{{ naviroom_venv }}"

- name: Check whether spaCy model exists
  ansible.builtin.shell: "ls -d {{ naviroom_venv }}/lib/python*/site-packages/en_core_web_sm 2>/dev/null | head -n 1"
  register: spacy_model_dir
  changed_when: false
  failed_when: false

- name: Install spaCy en_core_web_sm model
  ansible.builtin.command: "{{ naviroom_venv }}/bin/python -m spacy download en_core_web_sm"
  when: spacy_model_dir.stdout == ""

- name: Render app environment file
  ansible.builtin.template:
    src: naviroom.env.j2
    dest: "{{ naviroom_app_dir }}/.env"
    mode: '0600'

- name: Render systemd service file for API
  ansible.builtin.template:
    src: naviroom-api.service.j2
    dest: /etc/systemd/system/naviroom-api.service
    mode: '0644'
  when: naviroom_enable_api_service
  notify: Restart naviroom api

- name: Ensure naviroom-api service is enabled and running
  ansible.builtin.systemd:
    name: naviroom-api
    enabled: true
    state: started
    daemon_reload: true
  when: naviroom_enable_api_service
