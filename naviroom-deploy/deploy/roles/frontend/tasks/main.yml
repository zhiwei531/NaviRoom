---
- name: Configure NodeSource repository for Node.js 20
  ansible.builtin.shell: |
    set -e
    curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    executable: /bin/bash

- name: Install frontend build dependencies
  ansible.builtin.apt:
    name:
      - nodejs
    state: present
    update_cache: true
    lock_timeout: 600

- name: Ensure frontend source directory exists
  ansible.builtin.file:
    path: "{{ naviroom_frontend_dir }}"
    state: directory
    mode: '0755'

- name: Deploy frontend source directory
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ naviroom_frontend_bundle_name }}/"
    dest: "{{ naviroom_frontend_dir }}/"
    mode: preserve

- name: Check for package-lock.json
  ansible.builtin.stat:
    path: "{{ naviroom_frontend_dir }}/package-lock.json"
  register: frontend_lockfile

- name: Install npm dependencies (npm ci)
  ansible.builtin.command:
    cmd: npm ci
  args:
    chdir: "{{ naviroom_frontend_dir }}"
  when: frontend_lockfile.stat.exists

- name: Install npm dependencies (npm install)
  ansible.builtin.command:
    cmd: npm install
  args:
    chdir: "{{ naviroom_frontend_dir }}"
  when: not frontend_lockfile.stat.exists

- name: Build frontend static assets
  ansible.builtin.command:
    cmd: npm run build
  args:
    chdir: "{{ naviroom_frontend_dir }}"

- name: Ensure frontend web root exists
  ansible.builtin.file:
    path: "{{ naviroom_frontend_web_root }}"
    state: directory
    mode: '0755'

- name: Publish frontend dist to web root
  ansible.builtin.shell: "rsync -a --delete {{ naviroom_frontend_dir }}/dist/ {{ naviroom_frontend_web_root }}/"
  changed_when: true
