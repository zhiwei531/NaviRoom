---
# Ubuntu 22.04 MySQL 8.0 默认 root 使用 auth_socket（sudo mysql 免密）
# Ansible 以 root 身份运行（become: true），直接通过 unix socket 操作 MySQL
# 不设置 root 密码，避免认证方式混乱

- name: Install MySQL server
  ansible.builtin.apt:
    name: mysql-server
    state: present
    update_cache: true
    lock_timeout: 600

- name: Ensure mysql service is running and enabled
  ansible.builtin.service:
    name: mysql
    state: started
    enabled: true

- name: Restrict mysql to localhost only (secure default)
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address\s*='
    line: 'bind-address = 127.0.0.1'
  notify: Restart mysql

- name: Flush mysql handlers
  ansible.builtin.meta: flush_handlers

- name: Create NaviRoom database
  community.mysql.mysql_db:
    name: "{{ naviroom_db_name }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Create NaviRoom app user
  community.mysql.mysql_user:
    name: "{{ naviroom_db_user }}"
    password: "{{ naviroom_db_password }}"
    host: 'localhost'
    priv: "{{ naviroom_db_name }}.*:ALL"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
