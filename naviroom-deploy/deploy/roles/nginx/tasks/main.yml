---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    lock_timeout: 600

- name: Ensure nginx is enabled and running
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Render naviroom nginx site config
  ansible.builtin.template:
    src: naviroom.conf.j2
    dest: /etc/nginx/sites-available/naviroom.conf
    mode: '0644'
  notify: Reload nginx

- name: Enable naviroom nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/naviroom.conf
    dest: /etc/nginx/sites-enabled/naviroom.conf
    state: link
  notify: Reload nginx

- name: Disable default nginx site if present
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Flush nginx handlers
  ansible.builtin.meta: flush_handlers
